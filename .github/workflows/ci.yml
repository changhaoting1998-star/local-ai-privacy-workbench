name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject private paths, private-network addresses, and concrete Feishu App IDs
        run: |
          if rg -n '/Users/[A-Za-z0-9._-]+|/home/[A-Za-z0-9._-]+|10\\.23\\.[0-9]{1,3}\\.[0-9]{1,3}|cli_[a-z0-9]{16,}' \
            --glob '!backend/tests/**' \
            --glob '!frontend/tests/**' \
            --glob '!frontend/pnpm-lock.yaml' .; then
            echo 'Potential private identifier found'
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip check
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
